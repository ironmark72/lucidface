<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/>
    </marker>
    <linearGradient id="fe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834" stop-opacity="0"/><stop offset="1" stop-color="#eb6834" stop-opacity=".25"/>
    </linearGradient>
    <style>
      .t{font-size:15px;font-weight:600;fill:#0b0b0b}
      .s{font-size:13px;fill:#52514e}
      .ln{stroke:#8a8984;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="#fcfcfb" stroke="#e2e1dc"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0b0b0b">Long videos, slow uplinks: move only the face box</text>
  <text x="32" y="68" class="s">The tracker finds the smallest box that holds the face in every frame. Only that box travels to the GPU and back.</text>

  <!-- 1920x1080 frame at scale 0.25 -->
  <rect x="32" y="100" width="480" height="270" fill="#e9e8e3" stroke="#b9b8b2"/>
  <text x="44" y="122" class="s">camera original · 1920 × 1080 · 10-bit 4:2:2</text>
  <rect x="208" y="124" width="192" height="176" fill="#fdf0ea" stroke="#eb6834" stroke-width="2"/>
  <ellipse cx="304" cy="206" rx="46" ry="58" fill="#ffffff" stroke="#b9b8b2"/>
  <path d="M250 300 C 262 262, 346 262, 358 300" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="216" y="318" font-size="12" fill="#eb6834" font-weight="600">face box · 768 × 704</text>
  <text x="44" y="358" class="s">everything outside the box is never touched</text>

  <!-- steps -->
  <path class="ln" d="M512 236 H556" marker-end="url(#ar)"/>
  <rect x="560" y="120" width="280" height="76" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.5"/>
  <text x="576" y="148" class="t">1 · lucidface crop</text>
  <text x="576" y="172" class="s">on your machine</text>
  <rect x="560" y="206" width="280" height="76" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.5"/>
  <text x="576" y="234" class="t">2 · lucidface restore</text>
  <text x="576" y="258" class="s">on a rented GPU</text>
  <rect x="560" y="292" width="280" height="76" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.5"/>
  <text x="576" y="320" class="t">3 · lucidface composite</text>
  <text x="576" y="344" class="s">on your machine, 48 px feather</text>

  <path class="ln" d="M840 236 H884" marker-end="url(#ar)"/>
  <rect x="888" y="120" width="280" height="248" rx="10" fill="#0b0b0b"/>
  <text x="908" y="152" font-size="13" fill="#d6d5d0">27-minute 10-bit interview</text>
  <text x="908" y="196" font-size="15" fill="#d6d5d0">full file</text>
  <text x="908" y="230" font-size="34" font-weight="700" fill="#ffffff">10.6 GB</text>
  <text x="908" y="274" font-size="15" fill="#d6d5d0">uploaded instead</text>
  <text x="908" y="308" font-size="34" font-weight="700" fill="#ffffff">815 MB</text>
  <text x="908" y="346" font-size="13" fill="#d6d5d0">13× less to move</text>
</svg>
