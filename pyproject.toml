[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucidface"
version = "0.1.0"
description = "Restore out-of-focus faces in video, locked to what the camera actually filmed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "torch>=2.1",
  "torchvision>=0.16",
  "facexlib>=0.3",
]

[project.optional-dependencies]
identity = ["facenet-pytorch"]   # install with --no-deps; it pins an old torch
bench = ["lpips>=0.1.4"]
gfpgan = ["gfpgan>=1.3.8"]
body = ["einops"]
dev = ["pytest"]

[project.scripts]
lucidface = "lucidface.cli:main"

[tool.setuptools.packages.find]
include = ["lucidface*"]
